repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    exclude: >
      (?x)^(
        ^compiler/test/runnable/extra-files/.*$|
        ^compiler/test/compilable/extra-files/.*$|
        ^druntime/src/etc/valgrind/.*\.h$|
      )$
  - id: end-of-file-fixer
    exclude: >
      (?x)^(
        ^compiler/test/runnable/extra-files/.*$|
        ^compiler/test/compilable/extra-files/.*$|
        ^druntime/src/etc/valgrind/.*\.h$|
      )$
  - id: check-merge-conflict
  - id: check-added-large-files
  - id: detect-private-key
  - id: no-commit-to-branch
    args: [--branch, master]
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.38.0
  hooks:
    - id: check-github-workflows
- repo: local
  hooks:
    - id: changelog-file-names
      name: changelog entries are named dmd.*.dd or druntime.*.dd
      language: fail
      entry: changelog entries must be named dmd.<name>.dd or druntime.<name>.dd
      files: ^changelog/
      exclude: ^changelog/(README\.md|(dmd|druntime)\.[^/]*\.dd)$

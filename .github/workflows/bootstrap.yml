# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Bootstrap
on:
  pull_request:
    branches:
      - stable
    paths-ignore:
      - 'spec/**'
  push:
    branches:
      - master
      - stable
    paths-ignore:
      - 'spec/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        # 2.081.2 removed as it fails to compile 1fa0b3c166da8ec536512ed2d5d5dcc15f1ba89c
        version: [
                                                                2.076.1, 2.077.1, 2.078.3, 2.079.1,
          2.080.1,          2.082.1, 2.083.1, 2.084.1, 2.085.1, 2.086.1, 2.087.1, 2.088.1, 2.089.1,
          2.090.1, 2.091.1, 2.092.1, 2.093.1, 2.094.2, 2.095.1, 2.096.1, 2.097.2, 2.098.1, 2.099.1,
          2.100.2, 2.101.2, 2.102.2, 2.103.1, 2.104.2, 2.105.3, 2.106.1, 2.107.1, 2.108.1, 2.109.1,
          2.110.0, 2.111.0
        ]

    name: Build with dmd-${{ matrix.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install host compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-${{ matrix.version }}

      - name: Clone Phobos
        run: git clone --depth 1 --branch "${{ github.base_ref || github.ref_name }}" https://github.com/dlang/phobos ../phobos || git clone --depth 1 https://github.com/dlang/phobos ../phobos

      - name: Build
        run: |
          make -j$(nproc) HOST_DMD="$DMD" ENABLE_RELEASE=0 ENABLE_DEBUG=0
          make -j$(nproc) -C ../phobos

      - name: Self-compile dmd
        run: |
          mkdir -p _generated/linux/release
          mv generated/linux/release/64 _generated/linux/release/
          make -j$(nproc) HOST_DMD=$PWD/_generated/linux/release/64/dmd ENABLE_RELEASE=0 ENABLE_DEBUG=0 dmd
